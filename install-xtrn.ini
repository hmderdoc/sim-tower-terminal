Name: SimTower
Desc: Build and run a 100-story tower; a faithful SimTower (1994) for the terminal
By:   HM Derdok
Cats: Games
Subs: Simulation, Strategy

[prog:SIMTOWER]
name = SimTower
cmd  = ./simtower -dropfile %f
settings = XTRN_MULTIUSER | XTRN_ANSI | XTRN_NATIVE
type = XTRN_DOOR32
required = true
