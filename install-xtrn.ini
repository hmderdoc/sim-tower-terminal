Name: Sim Tower (terminal version)
Desc: Build and run a 100-story tower: a faithful SimTower for the terminal
By:   HM Derdok
Cats: Games
Subs: Simulation, Strategy
Inst: Build the binary first ("go build -o simtower ./cmd/simtower" in this directory, or drop a release binary here as "simtower").

[prog:SIMTOWER]
name = Sim Tower (terminal version)
cmd  = simtower -dropfile %f
settings = XTRN_MULTIUSER | XTRN_ANSI | XTRN_NATIVE
type = XTRN_DOOR32
execution_ars = ANSI AND COLS 80 AND ROWS 24
required = true
